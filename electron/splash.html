<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SENTINELX AI — Loading</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0b1120 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px;
      max-width: 560px;
    }
    .logo-badge {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.2) 0%, rgba(99, 102, 241, 0.1) 100%);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 0 30px rgba(14, 165, 233, 0.25);
      animation: pulse 2.5s ease-in-out infinite;
    }
    .logo-badge svg {
      width: 40px;
      height: 40px;
      stroke: #38bdf8;
    }
    h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #f8fafc;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    h1 span {
      color: #38bdf8;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      letter-spacing: 0.5px;
      margin-bottom: 32px;
      text-transform: uppercase;
      font-weight: 600;
    }
    .progress-bar-container {
      width: 320px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      margin-bottom: 18px;
    }
    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 40%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 4px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
      animation: slide 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }
    .status-text {
      font-size: 13px;
      color: #64748b;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
    @keyframes slide {
      0% {
        left: -40%;
      }
      100% {
        left: 100%;
      }
    }
    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 25px rgba(14, 165, 233, 0.2);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 0 40px rgba(14, 165, 233, 0.45);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-badge">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z" />
      </svg>
    </div>
    <h1 id="title-text">Sentinel<span>X</span> AI</h1>
    <div class="subtitle" id="subtitle-text">Industrial Worker Safety &amp; PPE Monitoring</div>
    <div class="progress-bar-container">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="status-text" id="status-text">Initializing Edge AI Engine &amp; Neural Weights...</div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const mode = params.get('app') || params.get('mode');
    if (mode === 'admin') {
      document.title = 'SENTINELX ADMIN — Initializing Control Plane';
      document.getElementById('title-text').innerHTML = 'Sentinel<span>X</span> Admin';
      document.getElementById('subtitle-text').textContent = 'Super Admin Control Plane & Commercial Licensing';
      document.getElementById('status-text').textContent = 'Initializing Administrative Cryptography & Registry...';
    }
  </script>
</body>
</html>
